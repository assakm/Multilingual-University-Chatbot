{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-md-12">
        <h1>RAG Chatbot Admin Dashboard</h1>
    </div>
</div>

<div class="row mt-4">
    <div class="col-md-4">
        <div class="card">
            <div class="card-header">
                <h5>System Statistics</h5>
            </div>
            <div class="card-body" id="stats-container">
                <div class="text-center">
                    <div class="spinner-border" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="col-md-8">
        <div class="card">
            <div class="card-header d-flex justify-content-between">
                <h5>FAQ Management</h5>
                <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addFaqModal">
                    Add FAQ
                </button>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped" id="faqTable">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Question (EN)</th>
                                <th>Department</th>
                                <th>Last Updated</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="faq-table-body">
                            <!-- FAQ rows will be loaded here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="row mt-4">
    <div class="col-md-12">
        <div class="card">
            <div class="card-header d-flex justify-content-between">
                <h5>System Actions</h5>
                <button class="btn btn-warning" id="reindexBtn">
                    Reindex Documents
                </button>
            </div>
            <div class="card-body">
                <div id="reindex-status"></div>
            </div>
        </div>
    </div>
</div>

<!-- Add FAQ Modal -->
<div class="modal fade" id="addFaqModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add New FAQ</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="addFaqForm">
                    <div class="mb-3">
                        <label class="form-label">Question (English)</label>
                        <input type="text" class="form-control" name="question_en" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Answer (English)</label>
                        <textarea class="form-control" name="answer_en" rows="4" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Tags (comma-separated)</label>
                        <input type="text" class="form-control" name="tags">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Department</label>
                        <input type="text" class="form-control" name="department">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="saveFaqBtn">Save FAQ</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
